<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Predictor Pro X</title>
<style>
:root{box-sizing:border-box;
--bg:transparent;--card:rgba(8, 23, 15, 0.95);--line:#1c5a3a;--txt:#e6fff0;--mut:#7fae95;--g:#2ee27a;--r:#ff5a5a;--v:#b48cff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:"Rajdhani","Segoe UI",system-ui,sans-serif;overflow:hidden;}
.app{max-width:280px;margin:0 auto;padding:6px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 0 20px rgba(46,226,122,.25)}
.head{display:flex;justify-content:space-between;gap:6px;align-items:center}
h1{margin:0;font-size:16px;letter-spacing:1px}
h1 span{color:var(--g)}
.controls{display:flex;gap:4px;align-items:center}
.timer-badge{background:#111;color:#ff5a5a;font-size:11px;padding:2px 6px;border-radius:4px;border:1px solid #ff5a5a;font-weight:700;}
.action-btn{background:none;border:none;font-size:14px;font-weight:bold;cursor:pointer;padding:0 2px}
.minimize-btn{color:#ffaa00}
.close-btn{color:#ff5a5a}

.bar{display:flex;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:6px 8px;margin:10px 0;font-size:12px;color:var(--mut)}
.bar b{color:var(--txt)}

.stage{border:1px solid var(--line);border-radius:12px;padding:10px 6px;background:linear-gradient(rgba(46,226,122,.08),transparent);text-align:center}
.result-box{width:65px;height:65px;border-radius:50%;display:inline-grid;place-items:center;font-size:22px;font-weight:700;color:var(--g);background:radial-gradient(circle at 35% 30%,#fff,#7ff0b0 55%,#1fa85c);border:3px solid var(--g);box-shadow:0 0 15px rgba(46,226,122,.6)}
.result-box.small{color:#ff5a5a;background:radial-gradient(circle at 35% 30%,#fff,#ffb0b0 55%,#e04545);border-color:var(--r);box-shadow:0 0 15px rgba(255,90,90,.6)}

.guess{display:flex;gap:6px;margin:10px 0}
.guess div{flex:1;border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;font-weight:700;font-size:14px;color:var(--g);background:#04100a}
.guess small{display:block;color:var(--mut);font-weight:400;font-size:10px}

.btns{display:flex;gap:6px}
button{flex:1;font:inherit;font-weight:700;font-size:14px;min-height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer}
.go{background:linear-gradient(#2ee27a,#12a850);color:#04180c;border:0}

.minimized-ball{display:none;background:#08170f;border:2px solid var(--g);color:var(--g);width:45px;height:45px;border-radius:50%;justify-content:center;align-items:center;font-weight:bold;font-size:12px;box-shadow:0 0 10px var(--g);cursor:pointer;text-align:center;line-height:41px}
</style>
</head>
<body>
<div class="app">
<div class="panel" id="mainCard">
<div class="head">
<div><h1>XS <span>PRO X</span></h1></div>
<div class="controls">
<span class="timer-badge" id="timer">00:30</span>
<button class="action-btn minimize-btn" onclick="minimizeApp()">-</button>
<button class="action-btn close-btn" onclick="closeApp()">×</button>
</div>
</div>

<div class="bar"><span>Period <b id="seq">--</b></span><span>Mode <b>WinGo 30s</b></span></div>

<div class="stage">
<div class="result-box" id="resBox">READY</div>
</div>

<div class="guess">
<div><small>Prediction</small><span id="gs">--</span></div>
</div>

<div class="btns">
<button class="go" onclick="startHack()">⚡ START HACK ⚡</button>
</div>
</div>

<div class="minimized-ball" id="minBall" onclick="restoreApp()">XS</div>
</div>

<script>
var currentPeriod = "";
var currentPrediction = "READY";

function updateTimerAndPeriod() {
    var now = new Date();
    var seconds = now.getSeconds();
    var remaining = 59 - seconds;
    if (remaining >= 30) remaining -= 30;
    
    var timerFormatted = "00:" + (remaining < 10 ? "0" : "") + remaining;
    document.getElementById("timer").innerText = timerFormatted;

    var year = now.getFullYear();
    var month = String(now.getMonth() + 1).padStart(2, '0');
    var day = String(now.getDate()).padStart(2, '0');
    
    var totalSecondsToday = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    var periodIndex = Math.floor(totalSecondsToday / 30) + 1;
    var paddedIndex = String(periodIndex).padStart(5, '0');
    var periodCode = year + month + day + paddedIndex;
    
    if (currentPeriod !== periodCode) {
        currentPeriod = periodCode;
        var lastDigit = parseInt(periodCode.slice(-1));
        currentPrediction = (lastDigit % 2 === 0) ? "BIG" : "SMALL";
    }

    document.getElementById("seq").textContent = currentPeriod;
}

setInterval(updateTimerAndPeriod, 1000);

function startHack() {
    var box = document.getElementById("resBox");
    box.textContent = "...";
    
    setTimeout(function() {
        box.textContent = currentPrediction;
        document.getElementById("gs").textContent = currentPrediction;
        
        if (currentPrediction === "BIG") {
            box.className = "result-box";
        } else {
            box.className = "result-box small";
        }
    }, 400);
}

function minimizeApp() {
    document.getElementById("mainCard").style.display = "none";
    document.getElementById("minBall").style.display = "flex";
}

function restoreApp() {
    document.getElementById("minBall").style.display = "none";
    document.getElementById("mainCard").style.display = "block";
}

function closeApp() {
    try {
        Android.closeMenu();
    } catch(e) {
        window.close();
    }
}
</script>
</body>
</html>
