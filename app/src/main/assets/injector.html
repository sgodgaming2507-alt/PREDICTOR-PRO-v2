<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VIP Number Panel</title>
<style>
:root {
    --bg: transparent;
    --card: rgba(18, 5, 5, 0.96);
    --line: #b32d2d;
    --txt: #ffcccc;
    --mut: #cc6666;
    --red: #ff3333;
    --glow: rgba(255, 51, 51, 0.4);
}
* { box-sizing: border-box; }
html, body {
    margin: 0;
    background: var(--bg);
    color: var(--txt);
    font-family: "Courier New", Courier, monospace, sans-serif;
    overflow: hidden;
}
.app { max-width: 290px; margin: 0 auto; padding: 6px; }
.panel {
    background: var(--card);
    border: 2px solid var(--red);
    border-radius: 14px;
    padding: 10px;
    box-shadow: 0 0 22px var(--glow);
}
.head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px dashed var(--line);
    padding-bottom: 6px;
    margin-bottom: 8px;
}
.title-box h1 {
    margin: 0;
    font-size: 13px;
    letter-spacing: 1.5px;
    color: var(--red);
    font-weight: bold;
}
.title-box .sub {
    font-size: 8px;
    color: var(--mut);
    letter-spacing: 1px;
}
.controls { display: flex; gap: 5px; align-items: center; }
.timer-badge {
    background: #0a0101;
    color: var(--red);
    font-size: 10px;
    padding: 2px 5px;
    border-radius: 3px;
    border: 1px solid var(--red);
    font-weight: bold;
}
.action-btn {
    background: none;
    border: none;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    padding: 0 2px;
}
.minimize-btn { color: #ffaa00; }
.close-btn { color: var(--red); }

.sys-status {
    font-size: 9px;
    color: var(--mut);
    background: #0d0202;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px;
    margin-bottom: 8px;
}
.sys-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 3px;
}
.sys-row:last-child { margin-bottom: 0; }
.sys-val { color: var(--red); font-weight: bold; }

/* Radar & Slot Reel Container */
.radar-container {
    position: relative;
    width: 85px;
    height: 85px;
    margin: 8px auto;
    border: 2px solid var(--red);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle, rgba(255,51,51,0.2) 0%, rgba(18,5,5,0.95) 80%);
    box-shadow: 0 0 15px var(--glow) inset;
    overflow: hidden;
}

.radar-core {
    position: relative;
    z-index: 5;
    background: rgba(18, 5, 5, 0.95);
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    border: 1px dashed var(--line);
    overflow: hidden;
}

/* Vertical Slot Reel Animation */
.slot-viewport {
    height: 40px;
    overflow: hidden;
    position: relative;
    width: 100%;
    text-align: center;
}
.slot-reel {
    position: absolute;
    width: 100%;
    transition: transform 1.5s cubic-bezier(0.1, 0.9, 0.2, 1);
}
.slot-item {
    height: 40px;
    line-height: 40px;
    font-size: 22px;
    font-weight: bold;
    color: var(--red);
    text-shadow: 0 0 8px var(--red);
}

.info-box {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    background: #0d0202;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 8px;
    margin-bottom: 8px;
}
.info-box span b { color: var(--red); }

.period-bar {
    background: #0d0202;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px;
    text-align: center;
    font-size: 10px;
    color: var(--txt);
    margin-bottom: 8px;
    letter-spacing: 0.5px;
}
.period-bar b { color: var(--red); }

.btn-exec {
    background: linear-gradient(135deg, #cc0000, #ff3333);
    border: none;
    color: #fff;
    width: 100%;
    padding: 7px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 0 10px var(--glow);
}
.btn-exec:active { transform: scale(0.98); }

.minimized-ball {
    display: none;
    background: #120505;
    border: 2px solid var(--red);
    color: var(--red);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    font-size: 11px;
    box-shadow: 0 0 10px var(--red);
    cursor: pointer;
    text-align: center;
    line-height: 38px;
}
</style>
</head>
<body>
<div class="app">
    <div class="panel" id="mainCard">
        <div class="head">
            <div class="title-box">
                <h1>VIP NUMBER PANEL</h1>
                <div class="sub">ESTABLISHED SPLENDOR</div>
            </div>
            <div class="controls">
                <span class="timer-badge" id="timer">00:30</span>
                <button class="action-btn minimize-btn" onclick="minimizeApp()">-</button>
                <button class="action-btn close-btn" onclick="closeApp()">×</button>
            </div>
        </div>

        <div class="sys-status">
            <div class="sys-row"><span>Server Status</span><span class="sys-val">CONNECTED</span></div>
            <div class="sys-row"><span>Bypass Status</span><span class="sys-val">ACTIVE</span></div>
        </div>

        <div class="radar-container">
            <div class="radar-core">
                <div class="slot-viewport">
                    <div class="slot-reel" id="slotReel">
                        <div class="slot-item">5</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="info-box">
            <span>SIZE: <b id="sizeRes">--</b></span>
            <span>ACCURACY: <b id="accRes">99.5%</b></span>
        </div>

        <div class="period-bar">
            PERIOD: <b id="periodText">--</b>
        </div>

        <button class="btn-exec" onclick="startHack()">⚡ EXECUTE HACK ⚡</button>
    </div>

    <div class="minimized-ball" id="minBall" onclick="restoreApp()">VIP</div>
</div>

<script>
var currentPeriod = "";
var currentNumber = 5;
var currentSize = "BIG";

function updateTimerAndPeriod() {
    var now = new Date();
    var seconds = now.getSeconds();
    var remaining = 59 - seconds;
    if (remaining >= 30) remaining -= 30;
    
    var timerFormatted = "00:" + (remaining < 10 ? "0" : "") + remaining;
    document.getElementById("timer").innerText = timerFormatted;

    var year = now.getFullYear();
    var month = String(now.getMonth() + 1).padStart(2, '0');
    var day = String(now.getDate()).padStart(2, '0');
    
    var totalSecondsToday = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    var periodIndex = Math.floor(totalSecondsToday / 30) + 1;
    var paddedIndex = String(periodIndex).padStart(5, '0');
    var periodCode = year + month + day + paddedIndex;
    
    if (currentPeriod !== periodCode) {
        currentPeriod = periodCode;
        var lastDigit = parseInt(periodCode.slice(-1));
        currentNumber = lastDigit;
        currentSize = (lastDigit >= 5) ? "BIG" : "SMALL";
    }

    document.getElementById("periodText").textContent = currentPeriod;
}

setInterval(updateTimerAndPeriod, 1000);

// Initialize slot reel with repeating numbers 0-9
function initReel() {
    var reel = document.getElementById("slotReel");
    var html = "";
    for (var i = 0; i < 6; i++) {
        for (var n = 0; n <= 9; n++) {
            html += '<div class="slot-item">' + n + '</div>';
        }
    }
    reel.innerHTML = html;
}
initReel();

function startHack() {
    var reel = document.getElementById("slotReel");
    var sizeRes = document.getElementById("sizeRes");
    sizeRes.textContent = "SCANNING";

    var targetNum = currentNumber;
    var itemHeight = 40;
    // Set landing position on the 4th rotation set
    var targetIndex = (4 * 10) + targetNum;
    var offset = -(targetIndex * itemHeight);

    reel.style.transition = "none";
    reel.style.transform = "translateY(0px)";

    setTimeout(function() {
        reel.style.transition = "transform 1.5s cubic-bezier(0.1, 0.9, 0.2, 1)";
        reel.style.transform = "translateY(" + offset + "px)";
    }, 50);

    setTimeout(function() {
        sizeRes.textContent = currentSize;
    }, 1550);
}

function minimizeApp() {
    document.getElementById("mainCard").style.display = "none";
    document.getElementById("minBall").style.display = "flex";
}

function restoreApp() {
    document.getElementById("minBall").style.display = "none";
    document.getElementById("mainCard").style.display = "block";
}

function closeApp() {
    try {
        Android.closeMenu();
    } catch(e) {
        window.close();
    }
}
</script>
</body>
</html>
